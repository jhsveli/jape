name: Release

on:
  release:
    types: [published]

permissions:
  contents: write          # to attach assets to the release

jobs:
  package:
    name: Package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned to commit SHA (currently actions/checkout@v4).
      # Bump by updating the SHA and this comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 21
        # Pinned to commit SHA (currently actions/setup-java@v4).
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: '21'

      - name: Derive version from tag
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Reuses scripts/package.sh: mvn clean package (runs the 43 tests),
      # jdeps module analysis, jlink trimmed runtime, jpackage app image
      # -> target/dist/Jape/
      - name: Build distributable
        run: bash scripts/package.sh

      - name: Compress app image
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) 7z a -tzip target/dist/jape-windows.zip target/dist/Jape ;;
            macOS)   (cd target/dist && zip -r jape-macos.zip Jape) ;;
            Linux)   tar -czf target/dist/jape-linux.tar.gz -C target/dist Jape ;;
          esac

      - name: Attach to release
        # Pinned to commit SHA (currently softprops/action-gh-release@v2).
        uses: softprops/action-gh-release@7a0ff5e07a28a673366aa995213582befc5bbff6
        with:
          files: |
            target/dist/jape-*.zip
            target/dist/jape-*.tar.gz
